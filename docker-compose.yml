services:
  db:
    image: postgres:14
    container_name: pet-diary-db
    restart: always
    environment:
      POSTGRES_DB: pet_diary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet-diary-backend
    restart: always
    ports:
      - "28080:28080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pet_diary
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db

  # 🌟 ngrok 대신 무료 Cloudflare Quick Tunnel(trycloudflare.com)로 대체
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pet-diary-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://backend:28080
    depends_on:
      - backend
