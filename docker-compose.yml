services:
  db:
    image: postgres:14
    container_name: pet-diary-db
    restart: always
    environment:
      POSTGRES_DB: pet_diary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet-diary-backend
    restart: always
    ports:
      - "28080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pet_diary
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db

  # 🌟 ngrok 서비스를 다시 제대로 합류시켰습니다!
  ngrok:
    image: ngrok/ngrok:latest
    container_name: pet-diary-ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=3EXq1jBGpMWPFWgZx2j83p0l8BO_3j7t3mtkACq14M2Y28DjX
    command: http backend:8080 # 백엔드가 컨테이너 내부에서 8080으로 돌고 있으므로 8080이 맞습니다.
    depends_on:
      - backend
